data_products_index=CREATE VECTOR INDEX dataProductIndex IF NOT EXISTS FOR (n:DataProduct) ON (n.embedding) OPTIONS {indexConfig: {`vector.dimensions`: 1024, `vector.similarity_function`: 'cosine'}}

data_products_embed_query={
    "data_products": {
        "embed_query" : "MATCH (node:DataProduct) OPTIONAL MATCH (node)-[:SUBDIVISION_OF]->(sub:SubDivison)-[:DIVISION_OF]->(div2HOP:BusinessDivision) OPTIONAL MATCH (node)-[:SUPER_DIVISION_OF]->(div1HOP:BusinessDivision) WITH node,sub, coalesce(div2HOP,div1HOP) as div OPTIONAL MATCH (node)-[:TYPE_OF]->(type:Type) OPTIONAL MATCH (node)-[:BUSINESS_DOMAIN_OF]->(bd:BusinessDomain) OPTIONAL MATCH (node)-[:DATA_DOMAIN_OF]->(dd:DataDomain) OPTIONAL MATCH (node)-[:STATUS_OF]->(st:Status) OPTIONAL MATCH (node)-[:BUSINESS_DOMAIN_OF]->(bd)<-[:BUSINESS_DOMAIN_OF]-(related:DataProduct) WHERE related.id <> node.id WITH node, sub, div, type, bd, dd, st, collect(DISTINCT related.name) AS relatedProducts RETURN node.id as id, 'Data Product ID: ' + node.id + '\nData Product: ' + coalesce(node.name, 'N/A') + '\nDescription: ' + coalesce(node.description, 'N/A') + '\nType: ' + coalesce(type.name, 'N/A') + '\nBusiness Division: ' + coalesce(div.name, 'N/A') + '\nSub-Division: ' + coalesce(sub.name, 'N/A') + '\nBusiness Domain: ' + coalesce(bd.name, 'N/A') + '\nData Domain: ' + coalesce(dd.name, 'N/A') + '\nStatus: ' + coalesce(st.name, 'N/A') + '\nOther products in the same Business Domain: ' + reduce(s = '', r IN relatedProducts | s + CASE WHEN s = '' THEN '' ELSE ', ' END + r) AS text",
        "add_embed_query" : "MATCH(n:DataProduct {id:$id}) SET n.embedding = $vec"
    }
}


