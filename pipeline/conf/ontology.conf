reviews_ontology=UNWIND $rows as row MERGE(n:Review {review_id:row.review_id}) SET n.review_score = row.review_score, n.review_comment_title = row.review_comment_tittle, n.review_comment_message = row.review_comment_message, n.review_creation_date = row.review_creation_date, n.review_answer_timestamp = row.review_answer_timestamp MERGE(m:Order {order_id:row.order_id}) MERGE(n)-[:ORDERED]->(m)
reviews_vector_index=CREATE VECTOR INDEX reviewIndex IF NOT EXISTS FOR (n:Review) ON (n.embedding) OPTIONS {indexConfig: {`vector.dimensions`: 1024, `vector.similarity_function`: 'cosine'}}
reviews_embed_query={
    "reviews_node": {
        "embed_query": "MATCH(n:Review) WHERE n.review_comment_message IS NOT NULL RETURN n.review_id as id, 'Comment Title: ' + coalesce(n.review_comment_title, 'N/A') + ' Score: ' + coalesce(toString(n.review_score), 'N/A') + ' Review: ' + coalesce(n.review_comment_message, 'N/A') as text",
        "add_embed_query":"MATCH(n:Review {review_id:$id}) SET n.embedding = $vec"
    }
}
embedder_model=qwen3-embedding:0.6b