reviews_ontology=UNWIND $rows as row MERGE(n:Review {review_id:row.review_id}) SET n.review_score = row.review_score, n.review_comment_title = row.review_comment_tittle, n.review_comment_message = row.review_comment_message, n.review_creation_date = row.review_creation_date, n.review_answer_timestamp = row.review_answer_timestamp MERGE(m:Order {order_id:row.order_id}) MERGE(n)-[:ORDERED]->(m)
reviews_vector_index=CREATE VECTOR INDEX reviewIndex IF NOT EXISTS FOR (n:Review) ON (n.embedding) OPTIONS {indexConfig: {`vector.dimensions`: 1024, `vector.similarity_function`: 'cosine'}}
reviews_embed_query={
    "reviews_node": {
        "embed_query": "MATCH(n:Review) WHERE n.review_comment_message IS NOT NULL RETURN n.review_id as id, 'Comment Title: ' + coalesce(n.review_comment_title, 'N/A') + ' Score: ' + coalesce(toString(n.review_score), 'N/A') + ' Review: ' + coalesce(n.review_comment_message, 'N/A') as text",
        "add_embed_query":"MATCH(n:Review {review_id:$id}) SET n.embedding = $vec"
    }
}
embedder_model=qwen3-embedding:0.6b
data_products_ontology=UNWIND $rows as row MERGE(n:DataProduct {product_id:row.product_id}) SET n.name = row.product_name, n.type = row.type, n.status = row.status, n.description = row.description MERGE(m:BusinessDomain) SET m.name = row.business_division_name  MERGE(o:DataDomain) SET o.name = row.data_domain_name MERGE(p:BusinessDivison) SET p.name = row.business_division_name MERGE(q:SubDivision) SET q.name = row.sub_division_name MERGE(n)-[:HAS_BUSINESS_DOMAIN]->(m) MERGE(n)-[:HAS_DATA_DOMAIN]->(o) MERGE(n)-[:BELONGS_TO_DIVISION]->(p) MERGE(n)-[:BELONGS_TO_SUBDIVISION]->(q) MERGE(p)-[:CONTAINS_SUBDIVISION]->(q)
data_products_columns=['business_division_name','sub_division_name','product_id','product_name','type','business_domain_name','data_domain_name','description','status']
data_products_embed_query={
    "data_products": {
        "embed_query" : "MATCH (n:DataProduct) OPTIONAL MATCH (n)-[rOut]->(mOut) OPTIONAL MATCH (mIn)-[rIn]->(n) WITH n, collect(DISTINCT reduce(s = '', l IN labels(n) | s + CASE WHEN s = '' THEN '' ELSE ',' END + l) + ' ' + coalesce(n.name, n.product_id, 'N/A') + ' -[' + type(rOut) + ']-> ' + reduce(s = '', l IN labels(mOut) | s + CASE WHEN s = '' THEN '' ELSE ',' END + l) + ' ' + coalesce(mOut.name, mOut.product_id, 'N/A')) AS outgoing, collect(DISTINCT reduce(s = '', l IN labels(mIn) | s + CASE WHEN s = '' THEN '' ELSE ',' END + l) + ' ' + coalesce(mIn.name, mIn.product_id, 'N/A') + ' -[' + type(rIn) + ']-> ' + reduce(s = '', l IN labels(n) | s + CASE WHEN s = '' THEN '' ELSE ',' END + l) + ' ' + coalesce(n.name, n.product_id, 'N/A')) AS incoming WITH n, outgoing + incoming AS allRelStrings RETURN n.product_id as id, 'Product ID: ' + coalesce(n.product_id, 'N/A') + '\nData Product Name: ' + coalesce(n.name, 'N/A') + '\nData Product Description: ' + coalesce(n.description, 'N/A') + '\nStatus: ' + coalesce(n.status, 'N/A') + '\nRelationships:\n' + reduce(s = '', x IN allRelStrings | s + CASE WHEN s = '' THEN '' ELSE '\n' END + x) AS text",
        "add_embed_query" : "MATCH(n:DataProduct {product_id:$id}) SET n.embedding = $vec"
    }
}
data_products_index=CREATE VECTOR INDEX dataProductIndex IF NOT EXISTS FOR (n:DataProduct) ON (n.embedding) OPTIONS {indexConfig: {`vector.dimensions`: 1024, `vector.similarity_function`: 'cosine'}}